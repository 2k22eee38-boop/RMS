name: Full Stack CI

on:
  push:
    branches: [ "priyanka-mainBranch" ]
  pull_request:
    branches: [ "priyanka-mainBranch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # Backend (Maven)
    # -------------------------
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Backend
      run: |
        ./mvnw clean install

    # -------------------------
    # Frontend (Node.js)
    # -------------------------
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
